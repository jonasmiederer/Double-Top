<title>Double Top v13</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
<style>
:root{--bg:#0b1120;--panel:#151e32;--panel2:#1f2a44;--line:#2c3a58;--text:#f1f5f9;--muted:#9fb0c8;--accent:#22c55e;--accent-ink:#04230f;--warn:#f59e0b;--warn-ink:#2a1700;--blue:#38bdf8;--blue-ink:#032536;--red:#f87171;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:.5rem .9rem;min-height:44px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:hover:not(:disabled){border-color:var(--muted)}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.4;cursor:not-allowed}
button[aria-pressed="true"]{background:var(--blue);color:var(--blue-ink);border-color:transparent;font-weight:700}
.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
.warn{background:var(--warn);color:var(--warn-ink);border-color:transparent;font-weight:700}
.danger{background:transparent;color:var(--red);border-color:#7f1d1d}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
input,select{font:inherit;color:var(--text);background:#070c18;border:1px solid var(--line);border-radius:10px;padding:.5rem .7rem;min-height:44px;max-width:100%}
header{position:sticky;top:0;z-index:10;background:rgba(11,17,32,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.5rem;padding:.55rem 1rem .35rem;font-weight:800;font-size:1.1rem}
.champ-badge{margin-left:auto;font-size:.85rem;color:var(--warn);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav{display:flex;gap:.35rem;overflow-x:auto;padding:0 .75rem .55rem;scrollbar-width:none}
nav button{border-radius:999px;min-height:36px;padding:.3rem .9rem;white-space:nowrap;font-size:.95rem}
nav button[aria-current="page"]{background:var(--text);color:var(--bg);font-weight:700}
main{max-width:1150px;margin:0 auto;padding:1rem .75rem 5rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1rem;margin-bottom:1rem}
h2{font-size:1.2rem;margin:0 0 .75rem}
h3{font-size:1.02rem;margin:0 0 .6rem}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.row.between{justify-content:space-between;flex-wrap:nowrap}
.row.center{justify-content:center}
.grow{flex:1 1 180px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.pill{display:inline-block;padding:.08rem .5rem;border-radius:999px;background:var(--panel2);color:var(--muted);font-size:.78rem;font-weight:600;vertical-align:middle}
.pill.ok{background:#14532d;color:#bbf7d0}
.pill.live{background:#713f12;color:#fde68a}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.grid .card{margin:0}
ul{list-style:none;margin:0;padding:0}
.steps{margin:0;padding-left:1.2rem}.steps li{margin:.25rem 0}
.plist li,.members li{padding:.3rem 0;border-bottom:1px solid var(--line)}
.plist li:last-child,.members li:last-child{border-bottom:0}
.idx{width:1.8rem;text-align:right}
.gname{font-weight:700}
.form{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:.55rem .8rem;align-items:center}
@media (max-width:520px){.form{grid-template-columns:1fr}.form label{margin-top:.3rem;font-size:.85rem;color:var(--muted)}}
.btnlike{display:inline-flex;align-items:center;min-height:44px;padding:.5rem .9rem;border-radius:10px;background:var(--panel2);border:1px solid var(--line);cursor:pointer}
#importFile:focus-visible + .btnlike{outline:3px solid var(--blue);outline-offset:2px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:.4rem .35rem;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.04em}
.num{text-align:right}
tr.q td{background:rgba(34,197,94,.08)}
.mlist{margin-top:.75rem;display:grid;gap:.4rem}
.mrow{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto;gap:.5rem;align-items:center;text-align:left}
.mrow .r{text-align:right}
.mrow .sc{font-weight:800;font-variant-numeric:tabular-nums}
.wn{font-weight:800;color:#86efac}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leaders{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));margin-bottom:1rem}
.leader{background:var(--panel2);border-radius:12px;padding:.6rem .8rem}
.leader b{display:block;font-size:1.3rem}
/* bracket */
.bracket{display:flex;gap:1.25rem;overflow-x:auto;padding:.25rem .1rem 1rem;align-items:stretch}
.round{display:flex;flex-direction:column;min-width:220px;flex:1 0 220px}
.round h3{text-align:center;color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:.05em}
.rbody{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:.75rem}
.bmatch{display:block;width:100%;padding:0;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:0}
.bmatch.live{border-color:var(--warn)}
.bside{display:flex;justify-content:space-between;gap:.5rem;padding:.5rem .65rem}
.bside+.bside{border-top:1px solid var(--line)}
.bside.win{background:#14532d;font-weight:800}
.bstat{display:block;padding:.2rem .65rem;font-size:.75rem;color:var(--muted);border-top:1px solid var(--line);background:rgba(0,0,0,.15)}
.seed{display:inline-block;min-width:1.4rem;color:var(--muted);font-size:.75rem}
.champ,.banner{text-align:center;border-color:var(--warn)}
.trophy{font-size:3rem;line-height:1}
/* scoring */
.score-wrap{max-width:760px;margin:0 auto}
.mtitle{text-align:right;min-width:0;flex:1}
.players{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:.75rem 0}
.pbox{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:.6rem .5rem;text-align:center;min-width:0}
.pbox.turn{border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,197,94,.25)}
.pbox.won{border-color:var(--warn)}
.pbox.out{opacity:.75}
.podium{list-style:none;padding:0;margin:.25rem 0 .9rem;font-size:1.15rem;font-weight:700}.podium li{margin:.2rem 0}
.mrow.multi{grid-template-columns:minmax(0,1fr) auto}
.players{grid-template-columns:1fr 1fr}
.pname{font-weight:700;font-size:1.05rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prem{font-size:clamp(2rem,9vw,4rem);font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.turnline{text-align:center;margin:.25rem 0 .5rem}
.hint{display:inline-block;margin-left:.4rem;padding:.1rem .55rem;border-radius:999px;background:#0c4a6e;color:#bae6fd;font-weight:700;font-size:.9rem}
.darts{display:flex;gap:.4rem;justify-content:center;align-items:center;margin:.4rem 0 .6rem}
.dart{min-width:68px;padding:.45rem .3rem;border-radius:10px;border:1px dashed var(--line);color:var(--muted);text-align:center;font-weight:700}
.dart.set{border-style:solid;border-color:var(--blue);color:var(--text)}
.dsum{font-weight:800;min-width:3.5rem;text-align:right}
.tdisp{text-align:center;font-size:2.4rem;font-weight:800;font-variant-numeric:tabular-nums;margin:.2rem 0 .5rem}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-bottom:.5rem}
.mults{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin-bottom:.4rem}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem}
.pad button,.keypad button{min-height:54px;font-size:1.2rem;font-weight:700;padding:.3rem}
.pad3{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin-top:.4rem}
.pad3 button{min-height:54px;font-weight:700}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem}
.quick{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.quick button{flex:1 0 56px}
.starter{margin:.25rem 0 .6rem}
.hist li{display:grid;grid-template-columns:minmax(0,1fr) auto 3.4rem 3.2rem;gap:.5rem;padding:.35rem 0;border-bottom:1px solid var(--line);align-items:center}
.hist .dd{color:var(--muted);font-size:.85rem}
.hist .bust .pts{color:var(--red)}
.hist .co{color:#86efac;font-weight:700}
#toast{position:fixed;left:50%;bottom:1.25rem;transform:translateX(-50%) translateY(180%);background:var(--text);color:var(--bg);padding:.7rem 1.1rem;border-radius:12px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:transform .25s ease;z-index:50;max-width:92vw;text-align:center;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}button:active:not(:disabled){transform:none}}
/* ---------- cricket ---------- */
.cboard{width:100%;border-collapse:separate;border-spacing:0 4px;table-layout:fixed;margin:.4rem 0 .2rem}
.cboard th{padding:0 .15rem .25rem;border:0;text-transform:none;letter-spacing:0;font-size:1rem;color:var(--text);vertical-align:bottom;white-space:normal}
.cboard td{padding:0;border:0;text-align:center;vertical-align:middle;white-space:normal}
.chead{position:relative;display:flex;flex-direction:column;align-items:center;gap:.1rem;padding:.45rem .25rem;border-radius:12px;border:2px solid var(--line);background:var(--panel);min-width:0;transition:border-color .2s,box-shadow .2s}
.chead.cur{border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,197,94,.25)}
.chead.won{border-color:var(--warn)}
.chead.out{opacity:.7}
.cname{font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cpts{font-size:clamp(1.6rem,8vw,2.4rem);font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums}
.cpts.lead{color:#fde68a}
.pfloat{position:absolute;top:-.3rem;right:.35rem;font-weight:900;font-size:1.1rem;color:var(--warn);animation:floatUp 1.2s ease-out both;pointer-events:none}
@keyframes floatUp{0%{transform:translateY(10px) scale(.8);opacity:0}20%{opacity:1;transform:translateY(0) scale(1.15)}100%{transform:translateY(-26px);opacity:0}}
.cm{height:50px;background:var(--panel);transition:background .2s}
.cm.cur{background:rgba(34,197,94,.12)}
.cm.dead{background:#0d1426}
.cboard.two td:first-child{border-radius:10px 0 0 10px}
.cboard.two td:last-child{border-radius:0 10px 10px 0}
.cboard.multi td:last-child{border-radius:0 10px 10px 0}
.cboard.multi td.cn .cnum{border-radius:10px 0 0 10px}
.cboard.multi td.cm{border-left:1px solid var(--line)}
.cnum{width:100%;height:50px;min-height:0;padding:0;border:0;border-radius:0;background:var(--panel2);font-size:1.3rem;font-weight:900;letter-spacing:.02em}
.cnum.score{background:linear-gradient(180deg,#92400e,#78350f);color:#fde68a}
.cnum.dead{color:var(--muted);text-decoration:line-through;background:#0d1426}
.cnum.dead:disabled{opacity:.6}
.mark{width:34px;height:34px;fill:none;stroke:var(--text);stroke-width:2.6;stroke-linecap:round;vertical-align:middle;overflow:visible;transform-origin:center}
.mark.closed{stroke:#86efac}
.cm.dead .mark{stroke:var(--muted)}
.mark .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .3s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.mark.closed.new{animation:closePulse .7s ease-out .3s}
@keyframes closePulse{40%{transform:scale(1.35);filter:drop-shadow(0 0 8px #22c55e)}100%{transform:none}}
.pad2{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-top:.4rem}
.pad2 button{min-height:54px;font-weight:700}
.center{text-align:center}
.gold{color:#fde68a;font-weight:700}
@media (prefers-reduced-motion:reduce){.mark .draw{animation:none;stroke-dashoffset:0}.mark.closed.new,.pfloat{animation:none}}
.warnline{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.4);border-radius:10px;padding:.5rem .7rem;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
/* ---------- elimination 301 ---------- */
.lanes{display:grid;gap:.4rem;margin:.4rem 0}
.lane{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:.3rem .65rem .25rem;min-width:0}
.lane.cur{border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,197,94,.25)}
.lane.won{border-color:var(--warn)}
.lane.out{opacity:.7}
.lane.kicked{animation:shake .5s ease-in-out .15s,redFlash 1s ease-out}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@keyframes redFlash{0%,30%{border-color:var(--red);box-shadow:0 0 0 4px rgba(248,113,113,.35)}}
.lane-top{display:flex;align-items:baseline;gap:.5rem}
.lane-name{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane-score{font-size:1.6rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.lane-sub{margin-top:.1rem;font-size:.78rem}
.kick-badge{color:var(--red);font-weight:900;font-size:.9rem;animation:pop .5s cubic-bezier(.2,1.7,.4,1) both}
.track{position:relative;height:12px;margin:.45rem 1.6rem 0 0;border-radius:999px;background:#070c18;border:1px solid var(--line)}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,#14532d,#22c55e);width:var(--to);animation:fillGo .6s ease-out both}
.track .fill.kicked{animation:fillKick .8s cubic-bezier(.5,0,.75,0) both}
@keyframes fillGo{from{width:var(--from)}to{width:var(--to)}}
@keyframes fillKick{0%{width:var(--from);background:var(--red)}100%{width:var(--to);background:var(--red)}}
.track .dot{position:absolute;top:50%;left:var(--to);width:20px;height:20px;border-radius:50%;background:var(--text);border:3px solid var(--accent);transform:translate(-50%,-50%);animation:dotGo .6s ease-out both;box-shadow:0 0 8px rgba(0,0,0,.5)}
.track .dot.kicked{border-color:var(--red);animation:dotKick .8s cubic-bezier(.5,0,.75,0) both}
@keyframes dotGo{from{left:var(--from)}to{left:var(--to)}}
@keyframes dotKick{from{left:var(--from)}to{left:var(--to)}}
.track .tick{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1.5px;background:var(--red);border-radius:2px}
.track .tick span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:.65rem;font-weight:900;color:var(--red)}
.track .goal{position:absolute;left:100%;top:50%;transform:translate(.35rem,-50%);font-size:.7rem;font-weight:900;color:var(--warn)}
.hint.kill{background:#7f1d1d;color:#fecaca}
.kill-txt{color:var(--red);font-weight:700;font-size:.85rem}
@media (prefers-reduced-motion:reduce){.lane.kicked,.track .fill,.track .dot,.kick-badge{animation:none!important}}
/* ---------- winning celebration ---------- */
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
#celebrate{position:fixed;inset:0;z-index:55;display:grid;place-items:center;padding:1rem;overflow:hidden;
  background:radial-gradient(circle at 50% 38%,rgba(245,158,11,.30),rgba(245,158,11,0) 58%),rgba(8,12,24,.96);opacity:0;transition:opacity .3s ease}
#celebrate.show{opacity:1}
#celebrate[hidden]{display:none}
.cele-card{position:relative;text-align:center;max-width:560px;width:100%}
.cele-rays{position:absolute;left:50%;top:38%;width:160vmax;height:160vmax;transform:translate(-50%,-50%);pointer-events:none;
  background:repeating-conic-gradient(rgba(245,158,11,.13) 0 9deg,transparent 9deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%);animation:spin 24s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.cele-board{width:min(58vw,240px);height:auto;overflow:visible}
.cele-board .board{transform-box:fill-box;transform-origin:center;animation:thunk .4s ease-out .52s both}
.cele-board .dart{transform-origin:0 0;animation:dartIn .55s cubic-bezier(.12,.8,.3,1) both}
.cele-board .wob{transform-origin:0 0;animation:wobble .6s ease-out .55s both}
.cele-board .shock{transform-box:fill-box;transform-origin:center;opacity:0;animation:shock .7s ease-out .53s both}
@keyframes dartIn{0%{transform:translateX(280px);opacity:0}12%{opacity:1}100%{transform:none}}
@keyframes wobble{0%{transform:none}20%{transform:rotate(6deg)}45%{transform:rotate(-4deg)}70%{transform:rotate(2deg)}100%{transform:none}}
@keyframes thunk{0%{transform:none}35%{transform:scale(.95)}70%{transform:scale(1.03)}100%{transform:none}}
@keyframes shock{0%{transform:scale(.6);opacity:1}100%{transform:scale(10);opacity:0}}
.cele-trophy{font-size:clamp(5rem,26vw,9rem);line-height:1;filter:drop-shadow(0 0 28px rgba(245,158,11,.65));
  animation:trophyIn 1s cubic-bezier(.2,1.5,.4,1) both,float 3s ease-in-out 1.1s infinite}
@keyframes trophyIn{0%{transform:scale(0) rotate(-35deg)}100%{transform:none}}
@keyframes float{50%{transform:translateY(-12px)}}
.cele-kicker{margin-top:.7rem;font-weight:800;letter-spacing:.14em;font-size:.78rem;white-space:pre-line;overflow-wrap:anywhere;color:var(--warn);text-transform:uppercase;animation:rise .5s .6s both}
.cele-name{margin:.15rem 0 .25rem;font-size:clamp(2.4rem,12vw,4.8rem);line-height:1.05;font-weight:900;overflow-wrap:anywhere;
  background:linear-gradient(90deg,#fde68a,#f59e0b,#fff7d6,#f59e0b,#fde68a);background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:pop .65s cubic-bezier(.2,1.7,.4,1) .75s both,shimmer 2.6s linear 1.4s infinite}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:none;opacity:1}}
@keyframes shimmer{to{background-position:-200% center}}
@keyframes rise{0%{transform:translateY(14px);opacity:0}100%{transform:none;opacity:1}}
.cele-sub{color:var(--text);opacity:.85;font-size:1.05rem;animation:rise .5s .95s both}
.cele-podium{list-style:none;padding:0;margin:.8rem 0 0;font-size:1.25rem;font-weight:700}
.cele-podium li{margin:.25rem 0;animation:rise .45s calc(1.05s + var(--d) * .18s) both}
.cele-card .cele-btn{margin-top:1.2rem;min-width:10rem;font-size:1.1rem;animation:rise .4s 1.35s both}
@media (prefers-reduced-motion:reduce){#celebrate,#celebrate *{animation:none!important;transition:none!important}}
/* "Moving effects" switched off in the settings: same still versions as the reduced-motion rules above */
.no-anim #toast{transition:none}.no-anim button:active:not(:disabled){transform:none}
.no-anim .mark .draw{animation:none;stroke-dashoffset:0}.no-anim .mark.closed.new,.no-anim .pfloat{animation:none}
.no-anim .lane.kicked,.no-anim .track .fill,.no-anim .track .dot,.no-anim .kick-badge{animation:none!important}
.no-anim #celebrate,.no-anim #celebrate *{animation:none!important;transition:none!important}
/* sound & effects settings */
.prefs{display:grid;gap:.1rem}
.pref{display:flex;align-items:center;gap:.65rem;padding:.5rem 0;border-bottom:1px solid var(--line, rgba(148,163,184,.18))}
.pref:last-child{border-bottom:0}
.pref label{flex:1;display:flex;align-items:center;gap:.65rem;cursor:pointer;min-width:0}
.pref input[type=checkbox]{width:1.35rem;height:1.35rem;flex:none;accent-color:var(--accent, #22c55e)}
.pref .phint{display:block;font-size:.8rem;color:var(--muted);font-weight:400;overflow-wrap:anywhere}
.pref label>span{min-width:0}
.pref button{flex:none;min-width:2.6rem}
.pref.off label{opacity:.5}
.prefs h3{margin:.8rem 0 .1rem;font-size:.95rem}
/* ---------- v10: design refresh – calmer surfaces, one accent, white selection, hairline borders ---------- */
:root{--bg:#090c12;--panel:#11161f;--panel2:#1a212d;--panel3:#232b39;--line:rgba(255,255,255,.075);--line2:rgba(255,255,255,.13);
  --text:#f2f5f9;--muted:#8a94a6;--accent:#2fd36b;--accent-ink:#03240f;--warn:#f5a524;--warn-ink:#2a1700;--blue:#5cc8ff;--blue-ink:#03263a;--red:#ff6b6b;
  --sel:#f2f5f9;--sel-ink:#0b0f17;--radius:16px;--shadow:inset 0 1px 0 rgba(255,255,255,.035),0 12px 28px -16px rgba(0,0,0,.7)}
body{background:radial-gradient(900px 480px at 50% -200px,rgba(47,211,107,.09),transparent 70%) fixed,var(--bg);letter-spacing:-.006em}
::selection{background:rgba(47,211,107,.35)}
*{scrollbar-color:#2a3242 transparent;scrollbar-width:thin}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* buttons: flat tonal surfaces; the selected option is white, the main action green, warnings amber */
button{background-color:var(--panel2);border:1px solid var(--line);border-radius:12px;font-weight:600;transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s,transform .08s}
button[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:transparent;font-weight:750}
.primary{background-color:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:750;box-shadow:0 8px 20px -10px rgba(47,211,107,.7)}
.warn{background-color:var(--warn);color:var(--warn-ink);border-color:transparent;font-weight:750}
.danger{background-color:rgba(255,107,107,.07);color:var(--red);border-color:rgba(255,107,107,.28)}
.btnlike{background:var(--panel2);border:1px solid var(--line);border-radius:12px;font-weight:600}
@media (hover:hover){ /* no sticky hover after a tap on phones */
  button:hover:not(:disabled){border-color:var(--line2);background-color:var(--panel3)}
  button[aria-pressed="true"]:hover:not(:disabled){background-color:#fff}
  .primary:hover:not(:disabled){background-color:#47e07f}
  .warn:hover:not(:disabled){background-color:#ffb43f}
  .danger:hover:not(:disabled){background-color:rgba(255,107,107,.14);border-color:rgba(255,107,107,.45)}
  .linkbtn:hover:not(:disabled){background:none;border:0}
  .btnlike:hover{background:var(--panel3);border-color:var(--line2)}
}
input,select{background:#0b0f16;border:1px solid var(--line2);border-radius:12px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:none;border-color:rgba(47,211,107,.65);box-shadow:0 0 0 3px rgba(47,211,107,.18)}
input::placeholder{color:#5f6a7d}
/* header: glass bar, logo tile, version chip, quiet tabs */
header{background:rgba(9,12,18,.78);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);border-bottom:1px solid var(--line)}
.brand{gap:.6rem;padding:.7rem 1rem .55rem;font-size:1.04rem;letter-spacing:-.018em}
.brand>span:first-child{display:inline-grid;place-items:center;flex:none;width:1.95rem;height:1.95rem;border-radius:10px;font-size:1.05rem;
  background:linear-gradient(140deg,#223046,#111823);box-shadow:inset 0 0 0 1px var(--line2),0 4px 12px -6px rgba(0,0,0,.8)}
.brand .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand>.small{flex:none;padding:.08rem .45rem;border-radius:999px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line);font-size:.68rem;letter-spacing:.03em}
nav{gap:.2rem;padding:0 .7rem .6rem}
nav button{background:transparent;border-color:transparent;color:var(--muted);font-weight:600;padding:.3rem .95rem}
nav button[aria-current="page"]{background:var(--sel);color:var(--sel-ink)}
@media (hover:hover){nav button:hover:not(:disabled){background:var(--panel2);color:var(--text);border-color:transparent}nav button[aria-current="page"]:hover:not(:disabled){background:#fff;color:var(--sel-ink)}}
/* cards and type */
main{padding-top:1.1rem}

<script>
(function () {
  'use strict';
  const APP_VERSION = 'v13'; // bump for every new version; versions are tracked as git commits of index.html
  const KEY = 'darts-party-tournament-v1'; // storage schema key – keep it, so saved games survive app updates
  const BYE = 'BYE';
  const IMPOSSIBLE = new Set([163, 166, 169, 172, 173, 175, 176, 178, 179]); // not reachable with 3 darts
  const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const $app = document.getElementById('app');
  const $toast = document.getElementById('toast');

  // ---------------------------------------------------------------- utils
  const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ask = (msg) => (typeof confirm === 'function' ? confirm(msg) : true);
  function rnd(n) {
    if (globalThis.crypto && globalThis.crypto.getRandomValues) {
      const a = new Uint32Array(1); globalThis.crypto.getRandomValues(a); return a[0] % n;
    }
    return Math.floor(Math.random() * n);
  }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  const dval = (d) => d.s * d.m;
  const sumDarts = (ds) => ds.reduce((t, d) => t + dval(d), 0);
  function dartLabel(d) {
    if (d.s === 0) return 'Miss';
    if (d.s === 25) return d.m === 2 ? 'Bull' : '25';
    return (d.m === 3 ? 'T' : d.m === 2 ? 'D' : '') + d.s;
  }

  // ---------------------------------------------------------------- state
  function defaultState() {
    return {
      v: 1,
      players: [],                       // {id, name}
      settings: { format: 'groups', startScore: 301, doubleOut: false, groupLegs: 1, koLegs: 2, advance: 1, groupCount: 0, sound: true, game: 'x01', cricketMode: 'standard',
        // sound & effects (v7); missing in older saves = on
        sndMiss: true, sndOver: true, sndElim: true, sndWin: true, animCele: true, animConfetti: true, animMotion: true,
        // knockout format (v9): 'bracket' = classic 1 vs 1 with byes, 'custom' = koPlan rounds [{games, adv}]
        koFormat: 'bracket', koPlan: null,
        // play mode (v13): 'tournament' = groups → knockout (default), 'quick' = one Quick Match of 1..many players, best of N legs
        mode: 'tournament', quickBestOf: 3 },
      groups: [],                        // {id, name, playerIds}
      started: false,
      matches: {},                       // id -> match
      groupOrder: [],                    // group-stage match ids in play order
      bracket: null,                     // {rounds: [[matchId, ...], ...]}
      quickMatch: null,                  // (v13) id of the Quick Match (the match itself lives in `matches`)
      view: { tab: 'setup', match: null, mode: 'dart' },
    };
  }
  function normalize(s) {
    const d = defaultState();
    if (!s || s.v !== 1) return d;
    return Object.assign(d, s, {
      settings: Object.assign(d.settings, s.settings || {}),
      view: Object.assign(d.view, s.view || {}),
    });
  }
  function load() {
    try { return normalize(JSON.parse(localStorage.getItem(KEY) || 'null')); } catch (e) { return defaultState(); }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable: keep in memory */ }
  }
  let S = load();
  const ui = { mult: 1, totalInput: '' };

  const playerById = (id) => S.players.find((p) => p.id === id);
  const pname = (id) => (playerById(id) || { name: '?' }).name;
  const groupById = (id) => S.groups.find((g) => g.id === id);
  function sideName(side) {
    if (!side) return 'TBD';
    if (side === BYE) return 'bye';
    if (side.type === 'player') return pname(side.key);
    const g = groupById(side.key);
    return g ? g.name : '?';
  }
  function sidePlayers(side) {
    if (!side || side === BYE) return [];
    if (side.type === 'player') return [side.key];
    const g = groupById(side.key);
    return g ? g.playerIds : [];
  }

  // ---------------------------------------------------------------- scoring engine
  // A match stores only raw visits; legs, remaining scores and winners are always derived by replay,
  // so undo is just "pop the last dart/visit".
  function newMatch(props) {
    const m = Object.assign({
      id: uid(), visits: [], pending: [], firstStarter: 0,
      startScore: S.settings.startScore, doubleOut: S.settings.doubleOut,
      game: ['cricket', 'elim'].includes(S.settings.game) ? S.settings.game : 'x01', cricketMode: S.settings.cricketMode === 'cutthroat' ? 'cutthroat' : 'standard',
    }, props);
    S.matches[m.id] = m;
    return m;
  }
  // ---------------------------------------------------------------- quick match (v13)
  // Quick Match is ONE duel match whose sides are all the players; it reuses the whole scoring engine.
  // best of N → first to floor(N/2)+1 legs; with a single player "best of N" = play exactly N legs
  // (legsToWin = N, since analyze bumps legsWon[0] once per leg and declares the winner at legsToWin).
  const quickLegsToWin = (nPlayers, bestOf) => (nPlayers === 1 ? bestOf : Math.floor(bestOf / 2) + 1);
  const quickMatchObj = () => {
    if (S.quickMatch && !S.matches[S.quickMatch]) S.quickMatch = null; // drop a dangling id (import / reset)
    return S.quickMatch ? S.matches[S.quickMatch] : null;
  };
  function startQuickMatch() {
    if (S.players.length < 1) return null;
    if (S.quickMatch && S.matches[S.quickMatch]) delete S.matches[S.quickMatch]; // replace any previous quick match
    const m = newMatch({ phase: 'quick', firstStarter: 0,
      legsToWin: quickLegsToWin(S.players.length, S.settings.quickBestOf),
      sides: S.players.map((p) => ({ type: 'player', key: p.id })) });
    S.quickMatch = m.id;
    S.view = Object.assign({}, S.view, { match: m.id, tab: 'match' });
    return m;
  }
  function resolveSrc(src) {
    if (src.type === 'bye') return BYE;
    if (src.type === 'seed') return src.side;
    if (src.type === 'place') { // custom knockout: Nth place of a multi-player game, known as soon as N players have finished
      const pm = S.matches[src.matchId]; if (!pm) return null;
      const pa = analyze(pm);
      return pa.order.length >= src.place ? resolveSides(pm)[pa.order[src.place - 1]] || null : null;
    }
    const sm = S.matches[src.matchId];
    return sm ? winnerSide(sm) : null;
  }
  const resolveSides = (m) => (m.sides ? m.sides : m.src.map(resolveSrc));
  const sideCount = (m) => (m.sides || m.src || [0, 0]).length;
  const mkLeg = (m, i, n) => ({ i, starter: (m.firstStarter + i) % n, rem: Array(n).fill(m.startScore), visits: [], finished: [], winner: null, turn: null });
  function isBust(m, after, lastDart) {
    return after < 0 || (m.doubleOut && after === 1) || (after === 0 && m.doubleOut && !!lastDart && lastDart.m !== 2);
  }
  // Two kinds of match:
  //  - duel (knockout): 2 sides, first to `legsToWin` legs, a leg ends at the first checkout
  //  - ranking (group game): all group players in ONE game; it continues after each checkout
  //    until only one player is left, and the finishing order is the result (out.order)
  function analyze(m) {
    if (m.game === 'cricket') return analyzeCricket(m);
    if (m.game === 'elim') return analyzeElim(m);
    const n = sideCount(m);
    const ranking = m.kind === 'ranking';
    const out = { legs: [], legsWon: Array(n).fill(0), winner: null, cur: null, order: [] };
    let leg = mkLeg(m, 0, n);
    for (const v of m.visits) {
      const rem = leg.rem[v.side];
      const after = rem - v.total;
      const last = v.darts && v.darts.length ? v.darts[v.darts.length - 1] : null;
      const bust = isBust(m, after, last);
      const r = { v, rem, bust, after: bust ? rem : after, checkout: !bust && after === 0 };
      leg.visits.push(r);
      if (!bust) leg.rem[v.side] = after;
      if (!r.checkout) continue;
      if (ranking) {
        leg.finished.push(v.side); out.order.push(v.side);
        if (leg.finished.length >= n - 1) {
          for (let i = 0; i < n; i++) if (!leg.finished.includes(i)) out.order.push(i); // last one left = last place
          leg.winner = out.order[0]; out.winner = out.order[0]; out.legs.push(leg); leg = null; break;
        }
        continue;
      }
      leg.winner = v.side; out.legsWon[v.side]++; out.legs.push(leg);
      if (out.legsWon[v.side] >= m.legsToWin) { out.winner = v.side; leg = null; break; }
      leg = mkLeg(m, out.legs.length, n);
    }
    if (leg) {
      if (!leg.visits.length) leg.turn = leg.starter;
      else { // next player in throwing order who has not finished yet
        const s = leg.visits[leg.visits.length - 1].v.side;
        for (let k = 1; k <= n; k++) { const c = (s + k) % n; if (!leg.finished.includes(c)) { leg.turn = c; break; } }
      }
      out.legs.push(leg); out.cur = leg;
    }
    return out;
  }
  const ordinal = (k) => k + (k === 1 ? 'st' : k === 2 ? 'nd' : k === 3 ? 'rd' : 'th');
  const medal = (k) => ['🥇', '🥈', '🥉'][k - 1] || `${k}.`;

  // ---------------------------------------------------------------- cricket engine
  // Close 20–15 and Bull with 3 marks each (single 1, double 2, triple 3; outer bull 1, bull 2).
  // Extra marks on a number you closed score its value while an opponent still has it open
  // (cut-throat: the points go to every opponent who still has it open, and the LOWEST score wins).
  // You are done when everything is closed and you lead (cut-throat: are lowest) among the players still in.
  const CRICKET = [20, 19, 18, 17, 16, 15, 25];
  const cricketMarks = (d) => (CRICKET.includes(d.s) ? (d.s === 25 ? Math.min(d.m, 2) : d.m) : 0);
  const tLabel = (t) => (t === 25 ? 'Bull' : String(t));
  function analyzeCricket(m) {
    const n = sideCount(m);
    const ranking = m.kind === 'ranking';
    const cut = m.cricketMode === 'cutthroat';
    const all = [...Array(n).keys()];
    const out = { legs: [], legsWon: Array(n).fill(0), winner: null, cur: null, order: [] };
    const mk = (i) => ({ i, cricket: true, starter: (m.firstStarter + i) % n, marks: all.map(() => Object.fromEntries(CRICKET.map((t) => [t, 0]))),
      pts: Array(n).fill(0), visits: [], finished: [], winner: null, turn: null });
    const closed = (L, p, t) => L.marks[p][t] >= 3;
    const isDone = (L, p) => {
      if (L.finished.includes(p) || !CRICKET.every((t) => closed(L, p, t))) return false;
      const others = all.filter((q) => q !== p && !L.finished.includes(q));
      return others.every((q) => (cut ? L.pts[p] <= L.pts[q] : L.pts[p] >= L.pts[q]));
    };
    let leg = mk(0), over = false;
    for (const v of m.visits) {
      if (over) break;
      const L = leg;
      const rec = { v, bust: false, checkout: false, marks: 0, gain: 0, given: 0, closedNow: [], after: 0 };
      L.visits.push(rec);
      for (const d of v.darts || []) {
        const t = d.s, k = cricketMarks(d), p = v.side;
        if (k) {
          const before = L.marks[p][t];

    } else if (m.kind === 'ranking' && m.phase === 'ko') {
      celebrate({ kicker: 'Game shot!', name: sideName(w), sub: `${matchTitle(m)} · ${m.adv > 1 ? `top ${m.adv} go through` : 'on to the next round'}`, podium: a.order.map((i) => sideName(sides[i])) });
    } else if (m.kind === 'ranking') {
      const g = groupById(m.groupId);
      celebrate({ kicker: 'Game shot!', name: sideName(w), sub: `wins ${g ? g.name : 'the group'}`, podium: a.order.map((i) => sideName(sides[i])) });
    } else {
      celebrate({ kicker: 'Game shot – and the match!', name: sideName(w), sub: `${a.legsWon[a.winner]}–${a.legsWon[1 - a.winner]} · ${matchTitle(m)} · on to the next round` });
    }
  }
  function celebrateChampion() {
    const R = S.bracket && S.bracket.rounds; if (!R) return;
    const fin = S.matches[R[R.length - 1][0]];
    if (fin && winnerIdx(fin) !== null && fin.visits.length) celebrateMatch(fin, analyze(fin));
    else { const c = champion(); if (c) celebrate({ champion: true, kicker: 'Double Top\n🏆 Champion 🏆', name: sideName(c), sub: '' }); }
  }

  // ---------------------------------------------------------------- actions
  function act(a, v) {
    switch (a) {
      case 'tab': S.view.match = null; S.view.tab = v; toTop(); break;
      case 'removePlayer':
        if (S.started && !S.groups.every((g) => !g.playerIds.includes(v) || (canTake(g) && !groupMatch(g)))) return; // only late arrivals not in a game yet
        S.players = S.players.filter((p) => p.id !== v);
        S.groups.forEach((g) => { g.playerIds = g.playerIds.filter((id) => id !== v); });
        break;
      case 'randomDraw': if (S.started) return; randomDraw(); toast('🎲 Groups drawn'); break;
      case 'addGroup': if (!lateOpen()) return; { const g = addGroup(); toast(`➕ ${g.name} added – put players in it, then start its game.`); } break;
      case 'drawLate': if (!lateOpen() || !drawLate()) return; break;
      case 'startGroup': {
        const g = groupById(v);
        if (!lateOpen() || !g || groupMatch(g)) return;
        if (g.playerIds.length < 2) { toast('A group needs at least 2 players.'); return; }
        startGroupGame(g); toast(`▶ ${g.name} is ready to play – see the Group stage tab.`);
        break;
      }
      case 'removeGroup': {
        const g = groupById(v);
        if (!lateOpen() || !g || groupMatch(g)) return;
        S.groups = S.groups.filter((x) => x !== g); S.settings.groupCount = S.groups.length;
        break;
      }
      case 'clearGroups': S.groups.forEach((g) => { g.playerIds = []; }); break;
      case 'start': if (!startTournament()) return; toTop(); break;
      case 'mode-sel': if (S.started) return; S.settings.mode = v === 'quick' ? 'quick' : 'tournament'; break;
      case 'startQuick': if (!startQuickMatch()) return; keepAwake(); toTop(); break;
      case 'resetQuick': {
        const m = quickMatchObj();
        if (m && (m.visits.length || m.pending.length) && !ask('Reset the quick match? All its results are deleted.')) return;
        if (m) delete S.matches[m.id];
        S.quickMatch = null; S.view.match = null; S.view.tab = 'setup';
        break;
      }
      case 'open': S.view.match = v; ui.mult = 1; ui.totalInput = ''; keepAwake(); toTop(); break;
      case 'back': S.view.match = null; toTop(); break;
      case 'mult': ui.mult = ui.mult === +v ? 1 : +v; render(); return;
      case 'dart': addDart(+v, ui.mult); return;
      case 'cdart': if (+v === 25 && ui.mult === 3) return; addDart(+v, ui.mult); return; // there is no triple bull
      case 'matchGame': { // switch one match between x01 and cricket before its first dart
        const m = curMatch();
        if (!m || m.visits.length || m.pending.length || editLock(m)) return;
        m.game = ['cricket', 'elim'].includes(v) ? v : 'x01';
        break;
      }
      case 'bull': addDart(25, ui.mult === 2 ? 2 : 1); return;
      case 'miss': addDart(0, 1); return;
      case 'undo': undo(); return;
      case 'mode': { const m = curMatch(); if (v === 'total' && m && m.pending.length) return; S.view.mode = v === 'total' ? 'total' : 'dart'; ui.totalInput = ''; break; }
      case 'key':
        if (v === 'del') ui.totalInput = ui.totalInput.slice(0, -1);
        else if (ui.totalInput.length < 3) ui.totalInput = (ui.totalInput === '0' ? '' : ui.totalInput) + v;
        render(); return;
      case 'ok': if (ui.totalInput === '') { toast('Type the score of the visit first.'); return; } submitTotal(parseInt(ui.totalInput, 10)); return;
      case 'quick': submitTotal(parseInt(v, 10)); return;
      case 'starter': {
        const m = curMatch();
        if (!m || m.visits.length || m.pending.length) return;
        if (v !== 'r') { m.firstStarter = Math.min(Math.max(parseInt(v, 10) || 0, 0), sideCount(m) - 1); break; }
        if (m.kind === 'ranking') { if (m.sides) m.sides = shuffle(m.sides); else m.src = shuffle(m.src); m.firstStarter = 0; toast('🎲 New throwing order'); }
        else { m.firstStarter = rnd(sideCount(m)); toast(`🎲 ${sideName(resolveSides(m)[m.firstStarter])} throws first`); }
        break;
      }
      case 'koFormat': {
        if (S.bracket) return;
        S.settings.koFormat = v === 'custom' ? 'custom' : 'bracket';
        if (v === 'custom') { const n = koEntrants().length; if (!S.settings.koPlan || planInfo(S.settings.koPlan, n).err) S.settings.koPlan = suggestPlan(n); }
        break;
      }
      case 'koSuggest': if (S.bracket) return; S.settings.koPlan = suggestPlan(koEntrants().length); break;
      case 'koStep': {
        if (S.bracket) return;
        const [r, f, d] = String(v).split(':'); const p = (S.settings.koPlan || [])[+r];
        if (!p || !['games', 'adv'].includes(f)) return;
        p[f] = Math.max(1, (p[f] | 0) + (+d || 0));
        break;
      }
      case 'koAddRound': {
        if (S.bracket) return;
        const plan = S.settings.koPlan || (S.settings.koPlan = suggestPlan(koEntrants().length));
        const info = planInfo(plan, koEntrants().length); // players reaching the final as it stands
        const fr = info.rounds[plan.length - 1];
        const left = fr ? fr.n : 0;
        if (left < 4) { toast(info.err && !fr ? `Fix the format first: ${info.err}` : `Only ${left} players reach the final – too few for another round.`); return; }
        plan.splice(plan.length - 1, 0, { games: Math.floor(left / 2), adv: 1 });
        break;
      }
      case 'koDelRound': {
        if (S.bracket) return;
        const plan = S.settings.koPlan || []; const r = +v;
        if (plan.length > 1 && r >= 0 && r < plan.length - 1) plan.splice(r, 1);
        break;
      }
      case 'genKO': {
        const late = unassignedPlayers().length + pendingGroups().reduce((t, g) => t + g.playerIds.length, 0);
        if (late && !ask(`${late} player${late > 1 ? 's are' : ' is'} not in a started group game yet and will miss the knockout. Draw the bracket anyway?`)) return;
        const all = S.groupOrder.every((id) => winnerIdx(S.matches[id]) !== null);
        if (!all && !ask('Not all group matches are finished. Draw the bracket with the current standings? Unfinished group matches will be frozen.')) return;
        if (S.settings.koFormat === 'custom') { const e = planInfo(S.settings.koPlan || [], koEntrants().length).err; if (e) { toast(`Knockout format: ${e}`); return; } }
        if (!generateKO()) { render(); return; }
        toTop(); break;
      }
      case 'resetKO': {
        if (!S.bracket) return;
        const ids = S.bracket.rounds.flat();
        const played = ids.some((id) => S.matches[id].visits.length || S.matches[id].pending.length);
        if (!ask(played ? 'Delete the bracket INCLUDING all knockout results?' : 'Delete and redraw the bracket?')) return;
        ids.forEach((id) => { delete S.matches[id]; });
        S.bracket = null;
        if (S.settings.format === 'teams') buildBracket(shuffle(S.groups).map((g) => ({ type: 'team', key: g.id })), null);
        else S.view.tab = 'stage';
        break;
      }
      case 'export': exportData(); return;
      case 'celeClose': closeCelebrate(); return;
      case 'sound': {
        S.settings.sound = S.settings.sound === false;
        const a = document.getElementById('sfx-miss');
        if (!S.settings.sound && a && a.pause) a.pause();
        if (!S.settings.sound) stopSfx();
        toast(S.settings.sound ? '🔊 Sound on' : '🔇 Sound off');
        break;
      }
      case 'celebrateChamp': celebrateChampion(); return;
      case 'sfxTest': if (SFX.includes(v)) playSfx(v, true); return; // ▶ preview, plays even when switched off
      case 'celeTest':
        celebrate({ kicker: 'Game shot!', name: 'Preview', sub: 'this is how a win looks', podium: ['Preview', 'Second', 'Third'] });
        return;
      case 'resetTournament':
        if (!ask('Reset the tournament? All match results are deleted; players and groups are kept.')) return;
        S.matches = {}; S.groupOrder = []; S.bracket = null; S.started = false; S.view.match = null; S.view.tab = 'groups';
        break;
      case 'resetAll':
        if (!ask('Delete EVERYTHING – players, groups and results?')) return;
        { const keep = {}; PREFS.forEach(([k]) => { keep[k] = S.settings[k]; }); // sound & effects are device settings, keep them
          S = defaultState(); Object.assign(S.settings, keep); }
        break;
      default: return;
    }
    save(); render();
  }
  function change(c, el) {
    const v = el.value;
    switch (c) {
      case 'renamePlayer': { // no re-render, so tabbing between name fields keeps working
        const p = playerById(el.dataset.id); const n = String(v).trim().slice(0, 40);
        if (p && n) p.name = n; else if (p) el.value = p.name;
        save(); return;
      }
      case 'renameGroup': {
        const g = groupById(el.dataset.id); const n = String(v).trim().slice(0, 30);
        if (g && n) g.name = n; else if (g) el.value = g.name;
        save(); return;
      }
      case 'pref': { // sound & effects checkboxes
        const k = el.dataset.k;
        if (!PREFS.some((p) => p[0] === k)) return;
        S.settings[k] = !!el.checked;
        if (!el.checked) {
          if (k === 'sound') stopSfx();
          const id = SFX.find((x) => SFX_KEY[x] === k); if (id) { const a = document.getElementById(id); if (a && a.pause) { a.pause(); a.currentTime = 0; } }
          if (k === 'animCele') closeCelebrate();
          if (k === 'animConfetti' || k === 'animMotion') FX.stop();
        }
        break;
      }
      case 'setting': {
        const k = el.dataset.k;
        if (k === 'format') {
          if (S.started) return;
          S.settings.format = v === 'teams' ? 'teams' : 'groups';
          S.groups.forEach((g, i) => { if (/^(Group|Team) [A-Z]\d*$/.test(g.name)) g.name = defaultGroupName(i); });
        } else if (k === 'quickBestOf') S.settings.quickBestOf = Math.min(Math.max(parseInt(v, 10) || 1, 1), 21);
        else if (k === 'doubleOut') S.settings.doubleOut = v === '1';
        else if (k === 'game') {
          if (v === 'cricket' || v === 'elim') S.settings.game = v;
          else { S.settings.game = 'x01'; S.settings.startScore = parseInt(v, 10) || 301; }
        } else if (k === 'cricketMode') S.settings.cricketMode = v === 'cutthroat' ? 'cutthroat' : 'standard';
        else if (['startScore', 'groupLegs', 'koLegs', 'advance'].includes(k)) S.settings[k] = parseInt(v, 10);
        break;
      }
      case 'groupCount': {
        if (S.started) return;
        const max = Math.max(1, Math.min(26, S.players.length));
        const n = Math.min(Math.max(parseInt(v, 10) || 1, 1), max);
        S.settings.groupCount = n; ensureGroups(n);
        break;
      }
      case 'assign': {
        const pid = el.dataset.id;
        const from = S.groups.find((g) => g.playerIds.includes(pid)); const to = groupById(v);
        if ((from && !canTake(from)) || (to && !canTake(to))) { render(); return; }
        S.groups.forEach((g) => { g.playerIds = g.playerIds.filter((x) => x !== pid); });
        if (to) to.playerIds.push(pid);
        if (from) syncGroupGame(from);
        if (to && to !== from) syncGroupGame(to);
        break;
      }
      case 'import': {
        const f = el.files && el.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          try {
            const s = JSON.parse(r.result);
            if (!s || s.v !== 1 || !Array.isArray(s.players)) throw new Error('not a backup');
            if (!ask('Replace the current data with this backup?')) return;
            S = normalize(s); S.view.match = null; save(); render(); toast('Backup imported');
          } catch (e) { toast('That file is not a valid backup.'); }
        };
        r.readAsText(f); el.value = '';
        return;
      }
      default: return;
    }
    save(); render();
  }

      <div class="form">

        ${st.game === 'cricket'

          : `<label for="set-doubleOut">Finish</label>${sel('doubleOut', [['0', 'Straight out (any segment)'], ['1', 'Double out']], st.doubleOut ? '1' : '0')}`}

      <p><button class="primary" data-a="startQuick" ${S.players.length < 1 ? 'disabled' : ''}>Start match ▶</button></p>`

        <button class="warn" data-a="drawLate" ${unassigned.length < 2 ? 'disabled' : ''}>🎲 Draw late arrivals into new groups</button>
        <button data-a="addGroup">➕ New empty group</button>
        <button data-a="tab" data-v="setup">➕ Add players</button>
      </div>
      <p class="muted small">${unassigned.length ? `${unassigned.length} waiting. The draw makes groups of about 3 and starts their games right away.` : 'Nobody is waiting right now.'}</p>` : `

  function bracketMatch(m) {

  // a multi-player knockout game (custom format): places instead of legs, ✓ for the ones going through
  function bracketGame(m) {

    const playable = sides.every((s) => s && s !== BYE);
    const live = playable && w === null && (m.visits.length || m.pending.length);
    const isFinal = S.bracket && m.round === S.bracket.rounds.length - 1;
    const adv = isFinal ? 0 : m.adv || 1;
    const status = w !== null ? 'finished' : !playable ? 'waiting' : live ? `live · ${a.order.length} finished` : `${sides.length} players · ${isFinal ? 'finishing order = final ranking' : `top ${adv} go through`} · tap to play`;
    const placeOf = (i) => (a.order.indexOf(i) >= 0 ? a.order.indexOf(i) + 1 : 0);
    const rows = sides.map((s, i) => {
      const pl = playable ? placeOf(i) : 0;
      const src = m.src[i];
      const label = src.type === 'seed' ? `<span class="seed">${src.seed}</span>` : '';
      const from = !s && src.type === 'place' ? `${ordinal(src.place)} of ${esc(matchTitle(S.matches[src.matchId]))}` : !s && src.type === 'winner' ? `Winner of ${esc(matchTitle(S.matches[src.matchId]))}` : '';
      return `<span class="bside ${pl === 1 || (pl && pl <= adv) ? 'win' : ''} ${!s ? 'muted' : ''}"><span class="nm">${label}${s ? esc(sideName(s)) : `<span class="small">${from || 'TBD'}</span>`}</span><span>${pl ? `${medal(pl)}${pl <= adv ? ' ✓' : ''}` : ''}</span></span>`;
    }).join('');

    return playable
      ? `<button class="bmatch ${live ? 'live' : ''}" data-a="open" data-v="${m.id}" aria-label="${esc(matchTitle(m))}: ${sides.map((s) => esc(sideName(s))).join(', ')}, ${status}">${inner}</button>`
      : `<div class="bmatch">${inner}</div>`;
  }
  // knockout format picker, shown until the knockout is drawn
  function koFormatCard() {
    if (S.settings.format === 'teams' || S.bracket) return '';
    const n = koEntrants().length, k = advanceCount();
    const custom = S.settings.koFormat === 'custom';
    const who = `${k === 1 ? 'the winner' : `the top ${k}`} of each of ${S.groups.filter((g) => groupMatch(g)).length} groups`;
    let body;

        const line = `<div class="kround">

          ${last ? `<span class="small muted">${sizes && sizes[0] > 2 ? 'finishing order = final ranking' : sizes ? '1 vs 1' : ''}</span>`

      body = `<div class="kplan">${rows}</div>

  // ---------------------------------------------------------------- cricket view
  function liveAnalyze(m, a) { // analysis including the darts of the visit in progress
