  }
  // classic cricket marks: 1 = "/", 2 = "X", 3 = circled X; strokes from `from` on are drawn in with an animation
  function markSVG(k, from) {
    const strokes = ['<line x1="7.5" y1="20.5" x2="20.5" y2="7.5" pathLength="1"', '<line x1="7.5" y1="7.5" x2="20.5" y2="20.5" pathLength="1"', '<circle cx="14" cy="14" r="11.5" pathLength="1"'];
    let out = '';
    for (let i = 0; i < k; i++) out += i >= from ? `${strokes[i]} class="draw" style="animation-delay:${((i - from) * 0.14).toFixed(2)}s"/>` : `${strokes[i]}/>`;
    return `<svg class="mark${k >= 3 ? ' closed' : ''}${k >= 3 && from < 3 ? ' new' : ''}" viewBox="0 0 28 28" aria-hidden="true">${out}</svg>`;
  }
  function gameSwitch(m) {
    if (m.visits.length || m.pending.length) return '';
    const g = m.game || 'x01';
    return `<div class="row center starter gsw" role="group" aria-label="Game"><span class="muted">Game:</span>
      <button data-a="matchGame" data-v="x01" aria-pressed="${g === 'x01'}">${m.startScore}</button>
      <button data-a="matchGame" data-v="cricket" aria-pressed="${g === 'cricket'}"><span class="ico" aria-hidden="true">🎯 </span>Cricket</button>
      <button data-a="matchGame" data-v="elim" aria-pressed="${g === 'elim'}"><span class="ico" aria-hidden="true">💥 </span>Elimination</button></div>`;
  }
  function starterPicker(m, sides, ranking) {
    if (m.visits.length || m.pending.length) return '';
    const n = sides.length;
    const order = Array.from({ length: n }, (_, k) => sides[(m.firstStarter + k) % n]);
    return `<div class="row center starter"><span class="muted">Who throws first?</span>
      ${sides.map((s, i) => `<button data-a="starter" data-v="${i}" aria-pressed="${m.firstStarter === i}">${esc(sideName(s))}</button>`).join('')}
      <button data-a="starter" data-v="r">🎲 ${ranking ? 'Shuffle order' : 'Random'}</button>
      ${n > 2 ? `<div class="small muted" style="flex-basis:100%;text-align:center">Throwing order: ${order.map((s) => esc(sideName(s))).join(' → ')}</div>` : ''}</div>`;
  }
  function resultBanner(m, a, sides, lock) {
    const nx = nextMatches(1, m.id)[0];
    const nxs = nx ? resolveSides(nx) : null;
    const result = m.kind === 'ranking'
      ? `<h2>${esc(sideName(sides[a.order[0]]))}${m.phase === 'ko' ? (m.round === S.bracket.rounds.length - 1 ? ' wins the final!' : ' wins the game!') : ' wins the group!'}</h2><ol class="podium">${a.order.map((i, k) => `<li>${medal(k + 1)} ${esc(sideName(sides[i]))}</li>`).join('')}</ol>`
      : m.phase === 'quick' && sideCount(m) === 1
        ? `<h2>${esc(sideName(sides[0]))} · ${a.legsWon[0]} of ${S.settings.quickBestOf} legs</h2>`
        : `<h2>${esc(sideName(sides[a.winner]))} wins ${duelScoreLine(m, a)}</h2>`;
    return `<section class="card banner"><div class="trophy" aria-hidden="true">🏆</div>${result}
      <div class="row center">${nx ? `<button class="primary" data-a="open" data-v="${nx.id}">Next: ${nxs.map((x) => esc(sideName(x))).join(' vs ')}</button>` : ''}
      <button data-a="back">Back to overview</button>
      <button data-a="undo" ${lock ? 'disabled' : ''}>⟲ Undo last throw</button></div>
      ${lock ? `<p class="muted small">${esc(lock)}</p>` : ''}</section>`;
  }
  function viewCricket(m) {
    const sides = resolveSides(m);
    const sound = S.settings.sound !== false;
    const cut = m.cricketMode === 'cutthroat';
    const ranking = m.kind === 'ranking';
    const head = `<div class="row between"><div class="row" style="flex-wrap:nowrap"><button data-a="back" aria-label="Back to overview">← Back</button>
      <button data-a="sound" aria-pressed="${sound}" aria-label="Sound effects ${sound ? 'on' : 'off'}" title="Sound effects">${sound ? '🔊' : '🔇'}</button></div>
      <div class="mtitle"><b>${esc(matchTitle(m))}</b><div class="small muted">Cricket · ${cut ? 'cut-throat – lowest score wins' : 'standard'} · ${ranking ? 'finishing order counts' : legsLabel(m)}</div></div></div>`;
    if (!sides.every((s) => s && s !== BYE)) return `<div class="score-wrap">${head}<section class="card"><p class="muted">Waiting for both opponents.</p></section></div>`;
    const a = analyze(m);
    const done = a.winner !== null;
    const live = done ? a : liveAnalyze(m, a);
    const leg = done ? a.legs[a.legs.length - 1] : (live.cur || a.cur);
    const turn = done ? -1 : a.cur.turn;
    const lock = editLock(m);
    const canPlay = !done && !lock;
    const n = sides.length;
    const anim = ui.anim && !done && ui.anim.leg === leg.i ? ui.anim : null;
    ui.anim = null; // animate only the render right after a dart
    const order = live.order;
    const placeOf = (i) => (order.indexOf(i) >= 0 ? order.indexOf(i) + 1 : 0);
    const dead = (t) => sides.every((_, i) => leg.marks[i][t] >= 3);
    const mpr = (side) => {
      let mk = 0, d = 0;
      for (const L of live.legs) for (const r of L.visits) if (r.v.side === side) { mk += r.marks; d += (r.v.darts || []).length; }
      return d ? ((mk / d) * 3).toFixed(2) : '–';
    };
    const best = (cut ? Math.min : Math.max)(...leg.pts);
    const mm = ui.mult;
    const headCell = (i) => {
      const place = ranking ? placeOf(i) : 0;
      const gain = anim ? leg.pts[i] - anim.pts[i] : 0;
      const team = sides[i].type === 'team';
      return `<th scope="col"><div class="chead ${i === turn ? 'cur' : ''} ${(done && a.winner === i) || place === 1 ? 'won' : ''} ${place && !done ? 'out' : ''}">
        ${gain > 0 ? `<span class="pfloat" aria-hidden="true">+${gain}</span>` : ''}
        <span class="cname">${i === turn ? '▶ ' : ''}${esc(sideName(sides[i]))}</span>
        ${team && !done ? `<span class="small muted nm">${i === turn ? 'Throwing' : 'Next'}: ${esc(pname(throwerFor(m, sides, i)))}</span>` : ''}
        <span class="cpts ${leg.pts[i] === best && leg.pts.some((x) => x !== best) ? 'lead' : ''}">${place ? medal(place) : leg.pts[i]}</span>
        <span class="small muted">${place ? `${ordinal(place)} · ${leg.pts[i]} pts` : `${ranking ? '' : `Legs ${a.legsWon[i]} · `}MPR ${mpr(i)}`}</span></div></th>`;
    };
    const cell = (i, t) => {
      const k = Math.min(3, leg.marks[i][t]);
      const from = anim && anim.side === i ? Math.min(3, anim.marks[t]) : k;
      return `<td class="cm ${i === turn ? 'cur' : ''} ${dead(t) ? 'dead' : ''}" aria-label="${esc(sideName(sides[i]))}: ${k} of 3 on ${tLabel(t)}">${markSVG(k, from)}</td>`;
    };
    const numBtn = (t) => {
      const isDead = dead(t);
      const scoring = turn >= 0 && !isDead && leg.marks[turn][t] >= 3;
      const pre = t === 25 ? (mm === 2 ? 'D-' : '') : mm === 3 ? 'T' : mm === 2 ? 'D' : '';
      const dis = !canPlay || isDead || (t === 25 && mm === 3);
      const why = isDead ? ', closed by everyone' : scoring ? (cut ? ', points go to open opponents' : ', you score here') : '';
      return `<td class="cn"><button class="cnum ${isDead ? 'dead' : ''} ${scoring ? 'score' : ''}" data-a="cdart" data-v="${t}" ${dis ? 'disabled' : ''}
        aria-label="${mm === 3 ? 'Triple ' : mm === 2 ? 'Double ' : ''}${tLabel(t)}${why}">${pre}${tLabel(t)}</button></td>`;
    };
    const rows = CRICKET.map((t) => (n === 2 ? `<tr>${cell(0, t)}${numBtn(t)}${cell(1, t)}</tr>` : `<tr>${numBtn(t)}${sides.map((_, i) => cell(i, t)).join('')}</tr>`)).join('');
    const thead = n === 2 ? `<tr>${headCell(0)}<th aria-hidden="true"></th>${headCell(1)}</tr>` : `<tr><th aria-hidden="true"></th>${sides.map((_, i) => headCell(i)).join('')}</tr>`;
    const cols = n === 2 ? '<col style="width:38%"><col style="width:24%"><col style="width:38%">' : `<col style="width:${n > 3 ? 18 : 22}%">${sides.map(() => '<col>').join('')}`;
    const board = `<table class="cboard ${n === 2 ? 'two' : 'multi'}"><caption class="sr-only">Cricket scoreboard</caption><colgroup>${cols}</colgroup><thead>${thead}</thead><tbody>${rows}</tbody></table>`;
    let top = '', controls = '';
    if (done) top = resultBanner(m, a, sides, lock);
    else if (lock) top = `<section class="card"><p class="muted">${esc(lock)}</p></section>`;
    else {
      const pend = m.pending;
      const thrower = throwerFor(m, sides, turn);
      const open = CRICKET.filter((t) => leg.marks[turn][t] < 3);
      const status = open.length ? `to close: ${open.map(tLabel).join(' · ')}` : cut ? 'all closed – needs the lowest score' : 'all closed – needs the most points';
      top = `${gameSwitch(m)}${starterPicker(m, sides, ranking)}
        <div class="turnline"><b>${esc(pname(thrower))}</b> to throw <span class="muted small">· ${status}</span></div>
        <div class="darts" aria-label="Darts this visit">${[0, 1, 2].map((i) => `<span class="dart ${pend[i] ? 'set' : ''}">${pend[i] ? esc(dartLabel(pend[i])) : `Dart ${i + 1}`}</span>`).join('')}</div>
        <div class="mults" role="group" aria-label="Multiplier">${[[1, 'Single'], [2, 'Double'], [3, 'Triple']].map(([v, l]) => `<button data-a="mult" data-v="${v}" aria-pressed="${mm === v}">${l}</button>`).join('')}</div>`;
      controls = `<div class="pad2"><button data-a="miss">Miss / 1–14</button><button data-a="undo" class="warn">⟲ Undo</button></div>
        <p class="muted small center">Tap a number to score it. <span class="gold">Gold</span> = ${cut ? 'your hits give points to opponents still open there' : 'you closed it – extra hits score points'}.</p>`;
    }
    const hleg = done ? a.legs[a.legs.length - 1] : a.cur;
    const prevLegs = a.legs.filter((L) => L.winner !== null && L !== hleg).map((L) => `Leg ${L.i + 1}: ${esc(sideName(sides[L.winner]))}`).join(' · ');
    const shown = hleg.visits.slice().reverse();
    const hist = `<section class="card" style="margin-top:1rem"><h3>${ranking ? 'Throws' : `Leg ${hleg.i + 1} – throws`}</h3>
      ${prevLegs ? `<p class="small muted">${prevLegs}</p>` : ''}
      ${shown.length ? `<ul class="hist">${shown.map((r) => `<li class="${r.checkout ? 'co' : ''}"><span class="nm">${esc(pname(r.v.p))}</span>
        <span class="dd">${(r.v.darts || []).map(dartLabel).join(' · ')}</span>
        <span class="num pts">${r.marks} M</span><span class="num muted">${cut ? (r.given ? `→${r.given}` : '') : r.gain ? `+${r.gain}` : ''}</span></li>`).join('')}</ul>` : '<p class="muted small">No throws yet.</p>'}</section>`;
    return `<div class="score-wrap">${head}${top}${board}${controls}${hist}</div>`;
  }

  // ---------------------------------------------------------------- elimination view: a race track per player
  function viewElim(m) {
    const sides = resolveSides(m);
    const sound = S.settings.sound !== false;
    const ranking = m.kind === 'ranking';
    const T = ELIM_TARGET;
    const head = `<div class="row between"><div class="row" style="flex-wrap:nowrap"><button data-a="back" aria-label="Back to overview">← Back</button>
      <button data-a="sound" aria-pressed="${sound}" aria-label="Sound effects ${sound ? 'on' : 'off'}" title="Sound effects">${sound ? '🔊' : '🔇'}</button></div>
      <div class="mtitle"><b>${esc(matchTitle(m))}</b><div class="small muted">Elimination ${T} · ${m.doubleOut ? 'double out' : 'straight out'} · ${ranking ? 'finishing order counts' : legsLabel(m)}</div></div></div>`;
    if (!sides.every((s) => s && s !== BYE)) return `<div class="score-wrap">${head}<section class="card"><p class="muted">Waiting for both opponents.</p></section></div>`;
    const a = analyze(m);
    const done = a.winner !== null;
    const live = done ? a : liveAnalyze(m, a);
    const leg = done ? a.legs[a.legs.length - 1] : (live.cur || a.cur);
    const turn = done ? -1 : a.cur.turn;
    const lock = editLock(m);
    const canPlay = !done && !lock;
    const anim = ui.anim && ui.anim.leg === leg.i && ui.anim.from ? ui.anim : null;
    ui.anim = null;
    const pct = (x) => `${Math.max(0, Math.min(100, (x / T) * 100)).toFixed(2)}%`;
    const placeOf = (i) => (live.order.indexOf(i) >= 0 ? live.order.indexOf(i) + 1 : 0);
    const curScore = turn >= 0 ? leg.score[turn] : 0;
    const lane = (i) => {
      const sc = leg.score[i];
      const from = anim ? anim.from[i] : sc;
      const kicked = !!anim && anim.kicked.includes(i);
      const place = placeOf(i);
      const team = sides[i].type === 'team';
      const targets = i === turn ? sides.map((_, q) => q).filter((q) => q !== i && !leg.finished.includes(q) && leg.score[q] > sc) : [];
      return `<div class="lane ${i === turn ? 'cur' : ''} ${kicked ? 'kicked' : ''} ${place === 1 || (done && a.winner === i) ? 'won' : ''} ${place && !done ? 'out' : ''}">
        <div class="lane-top"><span class="lane-name">${i === turn ? '▶ ' : ''}${esc(sideName(sides[i]))}${team && !done ? ` <span class="small muted">(${esc(pname(throwerFor(m, sides, i)))})</span>` : ''}</span>
          ${kicked ? '<span class="kick-badge">💥 Back to 0!</span>' : ''}
          <span class="lane-score" aria-label="${sc} points">${place ? medal(place) + ' ' : ''}${sc}</span></div>
        <div class="track" aria-hidden="true">
          <div class="fill ${kicked ? 'kicked' : ''}" style="--from:${pct(from)};--to:${pct(sc)}"></div>
          ${targets.map((q) => `<span class="tick" style="left:${pct(leg.score[q])}" title="${esc(sideName(sides[q]))}: ${leg.score[q]}"><span>${esc(sideName(sides[q]).slice(0, 1).toUpperCase())}</span></span>`).join('')}
          <span class="dot ${kicked ? 'kicked' : ''}" style="--from:${pct(from)};--to:${pct(sc)}"></span>
          <span class="goal">${T}</span>
        </div>
        <div class="small muted lane-sub">${place ? `${ordinal(place)} place` : sc === 0 ? 'at the start' : `needs ${T - sc}`}${!ranking ? ` · legs ${a.legsWon[i]}` : ''}</div></div>`;
    };
    let top = '', pad = '';
    if (done) top = resultBanner(m, a, sides, lock);
    else if (lock) top = `<section class="card"><p class="muted">${esc(lock)}</p></section>`;
    else {
      const pend = m.pending;
      const left = 3 - pend.length;
      const thrower = throwerFor(m, sides, turn);
      const chips = [];
      const co = checkoutHint(T - curScore, left, m.doubleOut);
      if (co) chips.push(`<span class="hint">🏁 ${T}: ${co.map(dartLabel).join(' · ')}</span>`);
      sides.forEach((s, q) => {
        if (q === turn || leg.finished.includes(q) || leg.score[q] <= curScore) return;
        const h = checkoutHint(leg.score[q] - curScore, left, false);
        if (h && chips.length < 3) chips.push(`<span class="hint kill">💥 ${esc(sideName(s))} (${leg.score[q]}): ${h.map(dartLabel).join(' · ')}</span>`);
      });
      top = `${gameSwitch(m)}${starterPicker(m, sides, ranking)}
        <div class="turnline"><b>${esc(pname(thrower))}</b> to throw · on ${curScore}, needs ${T - curScore}</div>
        ${chips.length ? `<div class="row center" style="gap:.35rem;margin-bottom:.4rem">${chips.join('')}</div>` : ''}
        <div class="darts" aria-label="Darts this visit">${[0, 1, 2].map((i) => `<span class="dart ${pend[i] ? 'set' : ''}">${pend[i] ? esc(dartLabel(pend[i])) : `Dart ${i + 1}`}</span>`).join('')}<span class="dsum">+${sumDarts(pend)}</span></div>`;
      pad = `${dartPad()}<p class="muted small center">Land exactly on someone's score to send them back to 0 (checked after every dart). Over ${T} = bust.</p>`;
    }
    const hleg = done ? a.legs[a.legs.length - 1] : a.cur;
    const shown = hleg.visits.slice().reverse();
    const hist = `<section class="card" style="margin-top:1rem"><h3>${ranking ? 'Throws' : `Leg ${hleg.i + 1} – throws`}</h3>
      ${shown.length ? `<ul class="hist">${shown.map((r) => `<li class="${r.bust ? 'bust' : ''} ${r.checkout ? 'co' : ''}"><span class="nm">${esc(pname(r.v.p))}${r.kicks.length ? ` <span class="kill-txt">💥 ${r.kicks.map((k) => esc(sideName(sides[k.q]))).join(', ')}</span>` : ''}</span>
        <span class="dd">${(r.v.darts || []).map(dartLabel).join(' · ')}</span>
        <span class="num pts">${r.bust ? 'BUST' : `+${r.gained}`}</span><span class="num muted">${r.after}</span></li>`).join('')}</ul>` : '<p class="muted small">No throws yet.</p>'}</section>`;
    return `<div class="score-wrap">${head}${top}<div class="lanes">${sides.map((_, i) => lane(i)).join('')}</div>${pad}${hist}</div>`;
  }

  function viewScoring(m) {
    if (m.game === 'cricket') return viewCricket(m);
    if (m.game === 'elim') return viewElim(m);
    const sides = resolveSides(m);
    const sound = S.settings.sound !== false;
    const head = `<div class="row between"><div class="row" style="flex-wrap:nowrap"><button data-a="back" aria-label="Back to overview">← Back</button>
      <button data-a="sound" aria-pressed="${sound}" aria-label="Sound effects ${sound ? 'on' : 'off'}" title="Sound effects">${sound ? '🔊' : '🔇'}</button></div>
      <div class="mtitle"><b>${esc(matchTitle(m))}</b><div class="small muted">${m.startScore} · ${m.doubleOut ? 'double out' : 'straight out'} · ${m.kind === 'ranking' ? 'one game – finishing order counts' : legsLabel(m)}</div></div></div>`;
    if (!sides.every((s) => s && s !== BYE)) return `<div class="score-wrap">${head}<section class="card"><p class="muted">Waiting for both opponents.</p></section></div>`;
    const a = analyze(m);
    const done = a.winner !== null;
    const leg = done ? a.legs[a.legs.length - 1] : a.cur;
    const turn = done ? -1 : leg.turn;
    const pend = m.pending; const pendPts = sumDarts(pend);
    const lock = editLock(m);
    const mode = S.view.mode === 'total' ? 'total' : 'dart';
    const ranking = m.kind === 'ranking';
    const n = sides.length;
    const placeOf = (i) => (a.order.indexOf(i) >= 0 ? a.order.indexOf(i) + 1 : 0);
    const avg = (side) => {
      let p = 0, d = 0;
      for (const L of a.legs) for (const r of L.visits) if (r.v.side === side) { d += r.v.darts ? r.v.darts.length : 3; if (!r.bust) p += r.v.total; }
      return d ? ((p / d) * 3).toFixed(1) : '–';
    };
    const box = (i) => {
      const rem = leg.rem[i] - (i === turn ? pendPts : 0);
      const team = sides[i].type === 'team';
      const place = ranking ? placeOf(i) : 0;
      return `<div class="pbox ${i === turn ? 'turn' : ''} ${(done && a.winner === i) || place === 1 ? 'won' : ''} ${place && !done ? 'out' : ''}">
        <div class="pname">${i === turn ? '<span aria-hidden="true">▶ </span>' : ''}${esc(sideName(sides[i]))}</div>
        ${team && !done ? `<div class="small muted nm">${i === turn ? 'Throwing' : 'Next'}: ${esc(pname(throwerFor(m, sides, i)))}</div>` : ''}
        ${place ? `<div class="prem" aria-label="${ordinal(place)} place">${medal(place)}</div><div class="small"><b>${ordinal(place)} place</b></div>`
          : `<div class="prem" aria-label="${rem} remaining">${rem}</div>`}
        <div class="small muted">${ranking ? '' : `Legs <b>${a.legsWon[i]}</b> · `}Avg ${avg(i)}</div></div>`;
    };
    let entry;
    if (done) {
      const nx = nextMatches(1, m.id)[0];
      const nxs = nx ? resolveSides(nx) : null;
      const result = ranking
        ? `<h2>${esc(sideName(sides[a.order[0]]))}${m.phase === 'ko' ? (m.round === S.bracket.rounds.length - 1 ? ' wins the final!' : ' wins the game!') : ' wins the group!'}</h2><ol class="podium">${a.order.map((i, k) => `<li>${medal(k + 1)} ${esc(sideName(sides[i]))}</li>`).join('')}</ol>`
        : m.phase === 'quick' && n === 1
          ? `<h2>${esc(sideName(sides[0]))} · ${a.legsWon[0]} of ${S.settings.quickBestOf} legs</h2>`
          : `<h2>${esc(sideName(sides[a.winner]))} wins ${duelScoreLine(m, a)}</h2>`;
      entry = `<section class="card banner"><div class="trophy" aria-hidden="true">🏆</div>${result}
        <div class="row center">${nx ? `<button class="primary" data-a="open" data-v="${nx.id}">Next: ${nxs.map((x) => esc(sideName(x))).join(' vs ')}</button>` : ''}
        <button data-a="back">Back to overview</button>
        <button data-a="undo" ${lock ? 'disabled' : ''}>⟲ Undo last throw</button></div>
        ${lock ? `<p class="muted small">${esc(lock)}</p>` : ''}</section>`;
    } else if (lock) {
      entry = `<section class="card"><p class="muted">${esc(lock)}</p></section>`;
    } else {
      const remNow = leg.rem[turn] - pendPts;
      const hint = checkoutHint(remNow, mode === 'dart' ? 3 - pend.length : 3, m.doubleOut);
      const thrower = throwerFor(m, sides, turn);
      const order = Array.from({ length: n }, (_, k) => sides[(m.firstStarter + k) % n]);
      const starterPick = !m.visits.length && !pend.length ? `<div class="row center starter"><span class="muted">Who throws first?</span>
        ${sides.map((s, i) => `<button data-a="starter" data-v="${i}" aria-pressed="${m.firstStarter === i}">${esc(sideName(s))}</button>`).join('')}
        <button data-a="starter" data-v="r">🎲 ${ranking ? 'Shuffle order' : 'Random'}</button>
        ${n > 2 ? `<div class="small muted" style="flex-basis:100%;text-align:center">Throwing order: ${order.map((s) => esc(sideName(s))).join(' → ')}</div>` : ''}</div>` : '';
      const modeSw = `<div class="seg" role="group" aria-label="Input mode">
        <button data-a="mode" data-v="dart" aria-pressed="${mode === 'dart'}">Per dart</button>
        <button data-a="mode" data-v="total" aria-pressed="${mode === 'total'}" ${pend.length ? 'disabled' : ''}>Visit total</button></div>`;
      const slots = mode === 'dart'
        ? `<div class="darts" aria-label="Darts this visit">${[0, 1, 2].map((i) => `<span class="dart ${pend[i] ? 'set' : ''}">${pend[i] ? esc(dartLabel(pend[i])) : `Dart ${i + 1}`}</span>`).join('')}<span class="dsum">= ${pendPts}</span></div>`
        : `<div class="tdisp" aria-live="polite">${ui.totalInput || '0'}</div>`;
      entry = `${gameSwitch(m)}${starterPick}
        <div class="turnline"><b>${esc(pname(thrower))}</b> to throw${sides[turn].type === 'team' ? ` <span class="muted">(${esc(sideName(sides[turn]))})</span>` : ''}${ranking ? (a.order.length ? ` · playing for ${ordinal(a.order.length + 1)} place` : '') : ` · leg ${leg.i + 1}`}
        ${hint ? `<span class="hint">Checkout: ${hint.map(dartLabel).join(' · ')}</span>` : ''}</div>
        ${slots}${modeSw}${mode === 'dart' ? dartPad() : totalPad(remNow, m.doubleOut)}`;
    }
    const prevLegs = a.legs.filter((L) => L.winner !== null && L !== leg).map((L) => `Leg ${L.i + 1}: ${esc(sideName(sides[L.winner]))}`).join(' · ');
    const shown = leg.visits.slice().reverse();
    const hist = `<section class="card" style="margin-top:1rem"><h3>${ranking ? 'Throws' : `Leg ${leg.i + 1} – throws`}</h3>
      ${prevLegs ? `<p class="small muted">${prevLegs}</p>` : ''}
      ${shown.length ? `<ul class="hist">${shown.map((r) => `<li class="${r.bust ? 'bust' : ''} ${r.checkout ? 'co' : ''}"><span class="nm">${esc(pname(r.v.p))}</span>
        <span class="dd">${r.v.darts ? r.v.darts.map(dartLabel).join(' · ') : ''}</span>
        <span class="num pts">${r.bust ? 'BUST' : r.v.total}</span><span class="num muted">${r.after}</span></li>`).join('')}</ul>` : '<p class="muted small">No throws yet.</p>'}</section>`;
    return `<div class="score-wrap">${head}<div class="players ${n <= 4 ? `n${n}` : 'many'}" style="grid-template-columns:repeat(${n <= 3 ? n : 2},minmax(0,1fr))">${sides.map((_, i) => box(i)).join('')}</div>${entry}${hist}</div>`;
  }

  const LOGO = '<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="16" fill="#0d0f13"/><circle cx="16" cy="16" r="13.2" fill="#e5484d"/><circle cx="16" cy="16" r="10.6" fill="#f2e7cc"/><circle cx="16" cy="16" r="8" fill="#2fb36b"/><circle cx="16" cy="16" r="5.4" fill="#f2e7cc"/><circle cx="16" cy="16" r="2.6" fill="#e5484d"/></svg>';
  const NAV_ICONS = {setup:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.3-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.7a3.5 3.5 0 0 1 0 6.6M18.6 14.9c1.6.8 2.6 2.5 2.9 5.1"/></svg>',groups:'<svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>',stage:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg>',bracket:'<svg viewBox="0 0 24 24"><path d="M3 5h5v5H3M3 14h5v5H3M8 7.5h4v9H8M12 12h9"/></svg>',match:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg>',stats:'<svg viewBox="0 0 24 24"><path d="M5 20v-8M12 20V5M19 20v-5M3 20.5h18"/></svg>'};
  // round initial avatar, colour derived from the name so it stays the same everywhere
  function avatar(name, cls) {
    let h = 0; for (const ch of String(name)) h = (h * 31 + ch.codePointAt(0)) % 360;
    const ini = (String(name).trim()[0] || '?').toUpperCase();
    return `<span class="av ${cls || ''}" style="--h:${h}" aria-hidden="true">${esc(ini)}</span>`;
  }
  function render() {
    const ae = document.activeElement;
    const fa = ae && ae.dataset ? ae.dataset.a : null; const fv = ae && ae.dataset ? ae.dataset.v : null;
    const m = curMatch();
    if (S.view.match && !m) S.view.match = null;
    let tabs;
    if (S.settings.mode === 'quick') {
      tabs = [['setup', 'Players & rules'], ['match', 'Match'], ['stats', 'Stats']];
    } else {
      tabs = [['setup', 'Players & rules'], ['groups', S.settings.format === 'teams' ? 'Teams' : 'Groups']];
      if (S.settings.format === 'groups') tabs.push(['stage', 'Group stage']);
      tabs.push(['bracket', 'Bracket'], ['stats', 'Stats']);
    }
    if (!tabs.some((t) => t[0] === S.view.tab)) S.view.tab = 'setup';
    const views = { setup: viewSetup, groups: viewGroups, stage: viewStage, bracket: viewBracket, stats: viewStats, match: viewQuickMatch };
    const body = m ? viewScoring(m) : views[S.view.tab]();
    const champ = champion() || quickChampion();
    if (document.body && document.body.classList) document.body.classList.toggle('in-match', !!m); // phone: compact match layout
    if (document.documentElement && document.documentElement.classList) document.documentElement.classList.toggle('no-anim', !on('animMotion'));
    $app.innerHTML = `
      <header>
        <div class="brand"><span class="logo">${LOGO}</span><span class="bt"><span class="nm">Double Top</span><span class="sub">Darts night <i>· ${APP_VERSION}</i></span></span>${champ ? `<span class="champ-badge">🏆 ${esc(sideName(champ))}</span>` : ''}</div>
        <nav aria-label="Sections">${tabs.map(([id, l]) => `<button data-a="tab" data-v="${id}" ${!m && S.view.tab === id ? 'aria-current="page"' : ''}><span class="ni" aria-hidden="true">${NAV_ICONS[id]}</span><span class="nl-l">${l}</span><span class="nl-s">${({ setup: 'Players', stage: 'Stage' })[id] || l}</span></button>`).join('')}</nav>
      </header>
      <main>${body}</main>`;
    if (fa && $app.querySelector) { // keep keyboard focus on the same control across re-renders
      const el = $app.querySelector(`[data-a="${fa}"]${fv ? `[data-v="${fv}"]` : ''}`);
      if (el && !el.disabled && el.focus) el.focus({ preventScroll: true });
    }
    if (ae && ae.dataset && ae.dataset.c === 'pref' && ae.id) { // keep focus on a settings checkbox too
      const el = document.getElementById(ae.id); if (el && el.focus) el.focus({ preventScroll: true });
    }
  }

  // ---------------------------------------------------------------- events
  const celeOpen = () => { const c = document.getElementById('celebrate'); return !!c && !c.hidden; };
  document.addEventListener('click', (e) => {
    if (e.target && e.target.id === 'celebrate') { closeCelebrate(); return; } // tap outside the card
    const el = e.target.closest && e.target.closest('[data-a]');
    if (!el || el.disabled) return;
    act(el.dataset.a, el.dataset.v);
  });
  document.addEventListener('change', (e) => {
    const el = e.target.closest && e.target.closest('[data-c]');
    if (el) change(el.dataset.c, el);
  });
  document.addEventListener('submit', (e) => {
    const f = e.target.closest && e.target.closest('[data-f]');
    if (!f) return;
    e.preventDefault();
    if (f.dataset.f === 'addPlayer') {
      addPlayers(f.querySelector('input').value); save(); render();
      const ni = document.getElementById('newPlayer'); if (ni) ni.focus();
    }
  });
  document.addEventListener('keydown', (e) => {
    if (celeOpen()) { if (e.key === 'Escape') { e.preventDefault(); closeCelebrate(); } return; }
    if (!S.view.match) return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
    if (tag === 'button' && (e.key === 'Enter' || e.key === ' ')) return;
    const km = curMatch();
    if (S.view.mode === 'total' && !(km && (km.game === 'cricket' || km.game === 'elim'))) {
      if (/^[0-9]$/.test(e.key)) { e.preventDefault(); act('key', e.key); }
      else if (e.key === 'Backspace') { e.preventDefault(); act('key', 'del'); }
      else if (e.key === 'Enter') { e.preventDefault(); act('ok'); }
    } else if (e.key === 'Backspace') { e.preventDefault(); act('undo'); }
  });

  globalThis.DartsApp = { get state() { return S; }, act, change, addPlayers, render, analyze, checkoutHint, resolveSides, winnerIdx, champion, standings, playerStats, nextMatches };
  if (S.quickMatch && !S.matches[S.quickMatch]) S.quickMatch = null; // drop a dangling quick-match id after import / reset
  // Data saved by the first version had 1-vs-1 group matches. Rebuild those as one game per group,
  // keeping players, groups and rules.
  if (Object.values(S.matches).some((m) => m.phase === 'group' && m.kind !== 'ranking')) {
    const wasStarted = S.started;
    S.matches = {}; S.groupOrder = []; S.bracket = null; S.started = false; S.view.match = null;
    if (wasStarted && S.settings.format === 'groups') startTournament();
    save();
    toast('Updated: each group now plays one game together');
  }
  render();
})();
</script>
</body>
</html>
